[build-system]
requires = ["setuptools==83.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "tatatuya"
version = "0.1.3"
description = "Readings and cost calculations for Tuya energy meters"
requires-python = ">=3.11"
dependencies = [
    "PySide6==6.11.1",
    "sqlcipher3==0.6.2; sys_platform == 'darwin'",
    "pyobjc-framework-Security==12.1; sys_platform == 'darwin'",
]

[project.optional-dependencies]
dev = [
    "pip-audit==2.9.0",
    "pyright==1.1.411",
    "pytest==9.1.1",
    "pytest-cov==7.0.0",
    "ruff==0.15.22",
]
package = [
    "pyinstaller==6.21.0",
]

[project.scripts]
tatatuya = "tatatuya.application:run"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"tatatuya.ui" = ["styles.qss", "icons/*.svg"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"
markers = [
    "macos_keychain: native macOS Keychain/SQLCipher test with a disposable service",
]

[tool.pyright]
include = ["src", "tests", "scripts"]
exclude = ["build", "dist"]

[tool.coverage.run]
source = ["tatatuya"]
