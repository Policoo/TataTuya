name: Correctness checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  linux-correctness:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read

    steps:
      - name: Check out sources without persisted credentials
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
        with:
          persist-credentials: false

      - name: Install Qt runtime libraries
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends libegl1

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install project and pinned development dependencies
        run: python -m pip install ".[dev]"

      - name: Run complete Linux-verifiable gate
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          python -m ruff check .
          python -m pyright --pythonversion 3.12
          python -m pytest
          python -m pip check

  qt-lifecycle:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - order: transport-first
            tests: tests/unit/test_tuya_client.py tests/ui/test_main_window.py
          - order: ui-first
            tests: tests/ui/test_main_window.py tests/unit/test_tuya_client.py

    steps:
      - name: Check out sources without persisted credentials
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
        with:
          persist-credentials: false

      - name: Install Qt runtime libraries
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends libegl1

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install project and pinned development dependencies
        run: python -m pip install ".[dev]"

      - name: Run Qt lifecycle shard (${{ matrix.order }})
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest ${{ matrix.tests }}

  macos-security:
    runs-on: macos-15
    timeout-minutes: 20
    permissions:
      contents: read

    steps:
      - name: Check out sources without persisted credentials
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-macos.lock

      - name: Install hash-locked native environment
        run: |
          python -m venv .venv
          echo "${PWD}/.venv/bin" >> "${GITHUB_PATH}"
          .venv/bin/python -m pip install --require-hashes --only-binary=:all: -r requirements-macos.lock
          .venv/bin/python -m pip install --no-deps --no-build-isolation .

      - name: Run disposable native Keychain and SQLCipher checks
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest -m macos_keychain
