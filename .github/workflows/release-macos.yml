name: Prepare macOS ARM64 release

on:
  push:
    tags:
      - "v[0-9]*.[0-9]*.[0-9]*"

permissions:
  contents: read

jobs:
  qt-lifecycle:
    runs-on: macos-15
    timeout-minutes: 15
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - order: transport-first
            tests: tests/unit/test_tuya_client.py tests/ui/test_main_window.py
          - order: ui-first
            tests: tests/ui/test_main_window.py tests/unit/test_tuya_client.py

    steps:
      - name: Check out sources
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-macos.lock

      - name: Install test environment
        run: |
          python -m venv .venv
          echo "${PWD}/.venv/bin" >> "${GITHUB_PATH}"
          .venv/bin/python -m pip install --require-hashes --only-binary=:all: -r requirements-macos.lock
          .venv/bin/python -m pip install --no-deps --no-build-isolation .

      - name: Run Qt lifecycle shard (${{ matrix.order }})
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest ${{ matrix.tests }}

  build-and-test:
    needs: qt-lifecycle
    runs-on: macos-15
    timeout-minutes: 40
    permissions:
      contents: read

    steps:
      - name: Check out sources
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Scan complete history for secrets and private device identifiers
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITLEAKS_ENABLE_COMMENTS: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-macos.lock

      - name: Install hash-locked dependencies
        run: |
          python -m venv .venv
          echo "${PWD}/.venv/bin" >> "${GITHUB_PATH}"
          .venv/bin/python -m pip install --require-hashes --only-binary=:all: -r requirements-macos.lock
          .venv/bin/python -m pip install --no-deps --no-build-isolation .

      - name: Verify tag version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          PACKAGE_VERSION="$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          if [[ "${RELEASE_TAG}" != "v${PACKAGE_VERSION}" ]]; then
            echo "Tag ${RELEASE_TAG} does not match package version ${PACKAGE_VERSION}." >&2
            exit 1
          fi

      - name: Run checks and dependency audit
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          python -m ruff check .
          python -m pyright --pythonversion 3.12
          python -m pytest
          python -m pip check
          python -m pip_audit --strict --requirement requirements-macos.lock --disable-pip

      - name: Build ARM64 application
        run: ./scripts/build_macos.sh

      - name: Create DMG image
        run: ./scripts/create_dmg.sh "${GITHUB_REF_NAME}"

      - name: Create checksum and dependency SBOM
        run: |
          shasum -a 256 dist/TataTuya-*-arm64.dmg > "dist/TataTuya-${GITHUB_REF_NAME}-arm64.sha256"
          python -m pip_audit \
            --requirement requirements-macos.lock \
            --disable-pip \
            --format cyclonedx-json \
            --output "dist/TataTuya-${GITHUB_REF_NAME}-sbom.json"

      - name: Upload verified release inputs
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: TataTuya-${{ github.ref_name }}-arm64
          path: |
            dist/TataTuya-*-arm64.dmg
            dist/TataTuya-*-arm64.sha256
            dist/TataTuya-*-sbom.json
          if-no-files-found: error

  publish-draft:
    needs: build-and-test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      contents: write

    steps:
      - name: Download verified release inputs
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          mkdir dist
          gh run download "${GITHUB_RUN_ID}" --name "TataTuya-${GITHUB_REF_NAME}-arm64" --dir dist

      - name: Attach files to a draft GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            RELEASE_IS_DRAFT="$(gh release view "${GITHUB_REF_NAME}" --json isDraft --jq '.isDraft')"
            if [[ "${RELEASE_IS_DRAFT}" != "true" ]]; then
              echo "Release ${GITHUB_REF_NAME} is already public; artifacts will not be replaced automatically." >&2
              exit 1
            fi
          else
            gh release create "${GITHUB_REF_NAME}" --draft --verify-tag --generate-notes --title "TataTuya ${GITHUB_REF_NAME#v}"
          fi
          gh release upload "${GITHUB_REF_NAME}" dist/* --clobber
